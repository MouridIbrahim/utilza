<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Utilza — Everyday tools for files, PDFs, images, and documents</title>
    <meta
      name="description"
      content="Discover simple utilities, run browser tools, and process PDFs, images, documents, archives, and URLs."
    />

  <body>
    <div id="root"></div>
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem('utilza.theme') || 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
